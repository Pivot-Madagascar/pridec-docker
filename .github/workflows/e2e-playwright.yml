name: E2E Playwright (mode isolation)
run-name: E2E Playwright — ${{ github.ref_name }}

# The scenario of e2e/test_mode_isolation.py in a headless Chromium, against the whole stack started in the job:
# Redis (service), etlhub API and Celery worker, etlui (Vite), the forecast image (Docker). It logs in to a real DHIS2
# and launches real jobs in test mode: every DHIS2 write is a dry run, import_gee calls Google Earth Engine.
#
# Environment `init_test`:
# - secrets: DHIS2_TEST_URL (reachable from GitHub runners, PRIDE-C metadata), DHIS2_TEST_USERNAME,
#   DHIS2_TEST_PASSWORD, PIVOT_URL, PIVOT_TOKEN, GEE_PROJECT, GEE_SERVICE_ACCOUNT, GEE_PRIVATE_KEY_JSON (the whole
#   .gee-private-key.json);
# - variables: PARENT_OU, GEE_VARIABLES (empty = all), DISEASE_CODE, OU_LEVEL.
# Pull requests from forks get no secrets: the scenario is skipped.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'etlhub/**'
      - 'etlui/**'
      - 'etl/**'
      - 'assets/**'
      - 'e2e/**'
      - '.github/workflows/e2e-playwright.yml'

concurrency:
  group: e2e-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check secrets & DHIS2 reachability
    runs-on: ubuntu-latest
    environment: init_test
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check secrets and ping DHIS2
        id: check
        env:
          DHIS2_TEST_URL: ${{ secrets.DHIS2_TEST_URL }}
          DHIS2_TEST_USERNAME: ${{ secrets.DHIS2_TEST_USERNAME }}
          DHIS2_TEST_PASSWORD: ${{ secrets.DHIS2_TEST_PASSWORD }}
          PIVOT_URL: ${{ secrets.PIVOT_URL }}
          PIVOT_TOKEN: ${{ secrets.PIVOT_TOKEN }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_PRIVATE_KEY_JSON: ${{ secrets.GEE_PRIVATE_KEY_JSON }}
        run: |
          # Names only, never the values.
          missing=""
          for name in DHIS2_TEST_URL DHIS2_TEST_USERNAME DHIS2_TEST_PASSWORD PIVOT_URL PIVOT_TOKEN \
                      GEE_SERVICE_ACCOUNT GEE_PRIVATE_KEY_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::E2E skipped, secrets missing in environment init_test:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif curl --silent --max-time 10 --output /dev/null "${DHIS2_TEST_URL%/}/api/system/ping"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::E2E skipped, DHIS2_TEST_URL is not reachable from the GitHub runner."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Mode isolation, headless (Playwright)
    runs-on: ubuntu-latest
    environment: init_test
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    permissions:
      contents: read
      checks: write

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DHIS2_TEST_URL: ${{ secrets.DHIS2_TEST_URL }}
      DHIS2_TEST_USERNAME: ${{ secrets.DHIS2_TEST_USERNAME }}
      DHIS2_TEST_PASSWORD: ${{ secrets.DHIS2_TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            etlhub/requirements.txt
            e2e/requirements.txt

      - name: Install etlhub, the ETL scripts' libraries and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r etlhub/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps --only-shell chromium

      - name: Set up Node (etlui)
        uses: actions/setup-node@v4
        with:
          node-version-file: etlui/.nvmrc
          cache: yarn
          cache-dependency-path: etlui/yarn.lock

      - name: Install etlui
        working-directory: etlui
        run: yarn install --frozen-lockfile

      - name: Write .env and the GEE key
        env:
          PIVOT_URL: ${{ secrets.PIVOT_URL }}
          PIVOT_TOKEN: ${{ secrets.PIVOT_TOKEN }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_PRIVATE_KEY_JSON: ${{ secrets.GEE_PRIVATE_KEY_JSON }}
          PARENT_OU: ${{ vars.PARENT_OU }}
          GEE_VARIABLES: ${{ vars.GEE_VARIABLES }}
          DISEASE_CODE: ${{ vars.DISEASE_CODE }}
          OU_LEVEL: ${{ vars.OU_LEVEL }}
        run: |
          # Values come from the environment: none is printed. The worker reads .env from HOST_PWD for the forecast.
          umask 077
          host="$(python -c 'import os, urllib.parse as u; print(u.urlsplit(os.environ["DHIS2_TEST_URL"]).netloc)')"
          {
            echo "DRYRUN=true"
            echo "LOG_LEVEL=INFO"
            echo "PARENT_OU=$PARENT_OU"
            echo "OU_LEVEL=$OU_LEVEL"
            echo "DISEASE_CODE=$DISEASE_CODE"
            echo "GEE_PROJECT=$GEE_PROJECT"
            echo "GEE_SERVICE_ACCOUNT=$GEE_SERVICE_ACCOUNT"
            echo "GEE_VARIABLES=$GEE_VARIABLES"
            echo "PIVOT_URL=$PIVOT_URL"
            echo "PIVOT_TOKEN=$PIVOT_TOKEN"
            echo "DHIS2_ALLOWED_HOSTS=$host"
            echo "FRONTEND_URL=http://localhost:5173"
            echo "REDIS_HOST=localhost"
            echo "REDIS_PORT=6379"
            echo "REDIS_DB=0"
            echo "HOST_PWD=$GITHUB_WORKSPACE"
          } > .env
          printf '%s' "$GEE_PRIVATE_KEY_JSON" > .gee-private-key.json

      - name: Pull the forecast image
        run: docker pull mvevans89/pridec_forecast:1.0.0

      - name: Start the etlhub API, the Celery worker and etlui
        run: |
          mkdir -p logs e2e/artifacts
          (cd etlhub && nohup python -m run_server > ../logs/e2e-api.log 2>&1 &)
          nohup python -m etlhub.run_celery > logs/e2e-worker.log 2>&1 &
          (cd etlui && nohup yarn dev > ../logs/e2e-etlui.log 2>&1 &)
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:8111/docs; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:5173/; do sleep 2; done'
          timeout 120 bash -c 'until grep -q " ready" logs/e2e-worker.log; do sleep 2; done'

      - name: Run the end-to-end scenario
        run: python -m pytest e2e -v -rxXs --junitxml=e2e/artifacts/junit-e2e.xml

      - name: Publish the E2E report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Playwright Report
          path: e2e/artifacts/junit-e2e.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Upload screenshots and the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright
          path: e2e/artifacts/
          retention-days: 14
          if-no-files-found: ignore

      # The services' logs, on failure only: etlhub never logs a token, but they hold URLs and the jobs' output.
      - name: Upload the services' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-services-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove .env and the GEE key
        if: always()
        run: rm -f .env .gee-private-key.json
