name: ETLHub Unit Tests
run-name: ETLHub Unit Tests — ${{ github.ref_name }}

on:
  push:
    paths:
      - 'etlhub/**'
      - '.github/workflows/etlhub-tests.yml'
  pull_request:
    paths:
      - 'etlhub/**'
      - '.github/workflows/etlhub-tests.yml'

jobs:
  unit-tests:
    name: Unit tests (etlhub)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: etlhub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==7.2.1 httpx==0.25.0 fastapi==0.104.1 pydantic-settings==2.0.0 python-dotenv==1.0.0

      - name: Run unit tests
        run: pytest tests -v
