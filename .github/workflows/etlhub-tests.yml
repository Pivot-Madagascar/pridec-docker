name: ETLHub Unit Tests
run-name: ETLHub Unit Tests — ${{ github.ref_name }}

on:
  push:
    paths:
      - 'etlhub/**'
      - '.github/workflows/etlhub-tests.yml'
  pull_request:
    paths:
      - 'etlhub/**'
      - '.github/workflows/etlhub-tests.yml'

jobs:
  unit-tests:
    name: Unit tests (etlhub)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: etlhub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('etlhub/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install httpx==0.25.0

      - name: Run unit tests
        run: pytest tests -v