name: ETLHub Integration Tests
run-name: ETLHub Integration Tests — ${{ github.ref_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: etlhub-integration-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check DHIS2 secrets & connectivity
    runs-on: ubuntu-latest
    environment: init_test
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
      dhis2_reachable: ${{ steps.ping.outputs.reachable }}
    steps:
      # Same secrets as e2e-playwright.yml (environment init_test). A missing one fails the run: a skipped
      # integration test must not look green.
      - name: Check secrets
        id: check
        env:
          DHIS2_TEST_URL: ${{ secrets.DHIS2_TEST_URL }}
          DHIS2_TEST_USERNAME: ${{ secrets.DHIS2_TEST_USERNAME }}
          DHIS2_TEST_PASSWORD: ${{ secrets.DHIS2_TEST_PASSWORD }}
        run: |
          missing=""
          for name in DHIS2_TEST_URL DHIS2_TEST_USERNAME DHIS2_TEST_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in environment init_test:$missing"
            exit 1
          fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"

      - name: Ping DHIS2_TEST_URL
        id: ping
        env:
          DHIS2_TEST_URL: ${{ secrets.DHIS2_TEST_URL }}
        run: |
          # Never log the credentials here, only testing host reachability.
          if curl --silent --show-error --fail --max-time 10 \
              --output /dev/null --write-out "HTTP %{http_code}\n" \
              "${DHIS2_TEST_URL%/}/api/system/info"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DHIS2_TEST_URL is not reachable from the GitHub Actions runner."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

  integration-tests:
    name: Integration tests (DHIS2 auth)
    runs-on: ubuntu-latest
    environment: init_test
    needs: check-secrets
    permissions:
      contents: read
      checks: write
    if: |
      needs.check-secrets.outputs.has_secrets == 'true' &&
      needs.check-secrets.outputs.dhis2_reachable == 'true'

    defaults:
      run:
        working-directory: etlhub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('etlhub/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov

      - name: Run integration tests
        env:
          DHIS2_TEST_URL: ${{ secrets.DHIS2_TEST_URL }}
          DHIS2_TEST_USERNAME: ${{ secrets.DHIS2_TEST_USERNAME }}
          DHIS2_TEST_PASSWORD: ${{ secrets.DHIS2_TEST_PASSWORD }}
        run: |
          pytest tests -v -m "integration" \
            --junitxml=test-results/junit-integration.xml \
            --cov=. \
            --cov-report=xml:test-results/coverage-integration.xml

      # A skipped integration test (missing DHIS2_TEST_* variables) leaves pytest green: fail when none ran.
      - name: Fail if no integration test ran
        run: |
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("test-results/junit-integration.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          ran = sum(int(s.get("tests", 0)) - int(s.get("skipped", 0)) for s in suites)
          print(f"{ran} integration test(s) ran")
          sys.exit(1 if ran == 0 else 0)
          EOF

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: ETLHub Integration Tests Report
          path: etlhub/test-results/junit-integration.xml
          reporter: java-junit

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etlhub-integration-test-results
          path: |
            etlhub/test-results/junit-integration.xml
            etlhub/test-results/coverage-integration.xml
          retention-days: 14
          if-no-files-found: ignore