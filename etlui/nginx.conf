# etlui on port 3000, and the etlhub API (127.0.0.1:8111) proxied under /hub/ on the same origin.
# Run the container with --network host so 127.0.0.1 is the host's.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative: the browser's URL is the proxy's (https, no :3000), not this server's.
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;
  gzip_min_length 1000;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /hub/ {
    proxy_pass http://127.0.0.1:8111/;
    # FastAPI redirects /api/config to /api/config/ (307) with an absolute URL that lacks /hub.
    proxy_redirect ~^https?://[^/]+/(.*)$ /hub/$1;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # No timeout on jobs, by decision: a forecast can print nothing for long, /update_key is synchronous.
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    client_max_body_size 100m;  # input file uploads; raise it if an upload gets 413
  }

  # ponytail: lets /hub/docs load its schema; "Try it out" still calls /api/... without /hub and fails.
  # Upgrade path: FastAPI servers=[{"url": "/hub"}] in main.py (not uvicorn --root-path: middleware.py matches raw paths).
  location = /openapi.json {
    proxy_pass http://127.0.0.1:8111;
  }

  location /assets/ {
    expires 1y;  # Vite hashes these file names
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }
}
