# Redis for etlhub (job state, sessions, the DHIS2 token of the etlui login).
# Run from the repo root:
#   mkdir -p redis-data && chmod 700 redis-data
#   printf 'requirepass %s\n' "<REDIS_PASSWORD value>" > redis-secret.conf && chmod 600 redis-secret.conf
#   redis-server redis.conf --include "$PWD/redis-secret.conf"
# The include path must be absolute: `dir` below changes directory while the config is read.
# redis-secret.conf and redis-data/ are git-ignored. Passing the password with
# --requirepass would show it in `ps`.

bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Persistence: the DHIS2 credential and the sessions survive a restart, with their TTL.
dir ./redis-data
appendonly yes
appendfsync everysec
